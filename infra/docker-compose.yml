services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rwa_guard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rwa_guard"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rwa_guard_postgres:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ../services/backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rwa_guard
      PUBLIC_WEB_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../services/backend
    command: ["python", "-m", "rwa_guard.worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rwa_guard
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rwa_guard_postgres:
