name: RWA Guard CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
        working-directory: services/backend
      - run: npm ci
      - run: npm run gen:api
      - name: Verify generated contract artifacts are committed
        run: git diff --exit-code -- contracts/generated apps/web/src/types/generated
        working-directory: ${{ github.workspace }}
      - run: npm run verify

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Prime solc 0.8.24 for offline AST tests
        run: forge build
        working-directory: chain
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m mypy

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: chain
      - run: forge build
        working-directory: chain
      - run: forge test
        working-directory: chain
